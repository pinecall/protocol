# The Python side of the wire. Every module under pinecall_protocol/ is generated from ../schema.

[project]
name = "pinecall-protocol"
description = "The Pinecall wire: pydantic models generated from the protocol schema"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Bernardo Castro", email = "me@bernardocastro.dev" }]
dependencies = ["pydantic>=2.7,<3"]

[dependency-groups]
dev = [
  "ruff>=0.16,<1",
  "pyright==1.1.411",
  "pytest>=9,<10",
  # The metrics schema is checked against the library that measures them.
  "livekit-agents>=1.8,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pinecall_protocol/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["pinecall_protocol"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".."]
addopts = "--tb=short --strict-markers --strict-config"
filterwarnings = ["error"]
markers = ["unit: no keys, no network"]

[tool.pyright]
include = ["pinecall_protocol", "../tests"]
extraPaths = [".."]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pinecall_protocol", "tests"]
